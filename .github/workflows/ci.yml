name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Verify locked dependencies
        run: uv sync --python 3.12 --all-extras --locked
      - name: Lint
        run: uv run ruff check app tests evaluation examples
      - name: Type check
        run: uv run mypy app evaluation examples
      - name: Test
        run: uv run pytest
      - name: Evaluate
        run: uv run python -m evaluation.run

  docker:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          push: false
          tags: agentic-feedback:ci

  registry:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_REGISTRY_PUSH == 'true'
    runs-on: ubuntu-latest
    needs: [validate, docker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
