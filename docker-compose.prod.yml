services:
  app:
    image: ${APP_IMAGE:-agentic-feedback:local}
    build:
      context: .
      dockerfile: Dockerfile.prod
    env_file:
      - path: ${ENV_FILE:-.env.production}
        required: true
        format: raw
    expose:
      - "8000"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - backend

  caddy:
    image: caddy:2-alpine
    env_file:
      - path: ${CADDY_ENV_FILE:-.env.caddy}
        required: true
        format: raw
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 10s
    networks:
      - backend

networks:
  backend:

volumes:
  caddy_data:
  caddy_config:
